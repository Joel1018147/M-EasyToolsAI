<!DOCTYPE html>
<html data-platform="tools" lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Translation Audit — M-EasyTools AI+</title>
<link rel="stylesheet" href="/css/modus-design-system.css">
<link rel="stylesheet" href="/css/r2-tokens.css">
<style>
/* ── TRANSLATION AUDIT — DAILY-USE (Visual Bar §V) ────────────────────────
   Another page that pasted the platform orange: #E8622A on .run-btn and
   #FF7A45 in the <h1> and the progress gradient. Three literals, three
   chances to disagree with the master. All gone.

   It also invented a whole second dark palette (#07090F, #141820, #0ECFB0,
   #F4C430, #F43F5E) that ignored the theme the rest of the product is in.
   The system's own status colours mean the same three things and already
   clear §6's contrast bar in both themes.
   ──────────────────────────────────────────────────────────────────────── */
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;padding:32px;font-size:15px;line-height:1.55}
h1{font-family:var(--font-display);font-size:var(--t-page);font-weight:var(--w-page);color:var(--text);letter-spacing:-0.018em;margin-bottom:8px}
.subtitle{font-size:var(--t-second);color:var(--muted);margin-bottom:28px;max-width:var(--r2-measure)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px;margin-bottom:28px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:20px}
.card-title{font-size:var(--t-card);font-weight:var(--w-card);color:var(--text);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.badge{padding:3px 9px;border-radius:999px;font-size:var(--t-meta);font-weight:700}
.badge-ok{background:var(--green-bg);color:var(--green-text)}
.badge-warn{background:var(--amber-bg);color:var(--amber-text)}
.badge-err{background:var(--red-bg);color:var(--red-text)}
.stat-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--border);font-size:var(--t-second)}
.stat-row:last-child{border-bottom:none}
.stat-label{color:var(--muted)}
.stat-val{font-weight:700;font-family:var(--r2-mono);font-variant-numeric:tabular-nums;color:var(--text)}
.progress-bar{height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden;margin-top:12px}
/* Width only — the one property the daily-use split allows to move. */
.progress-fill{height:100%;border-radius:3px;background:var(--accent);transition:width var(--motion-slow) var(--ease-out)}
.progress-fill.is-ok{background:var(--green)}
.progress-fill.is-warn{background:var(--amber)}
.progress-fill.is-err{background:var(--red)}
.section{margin-bottom:26px}
.section-title{font-family:var(--font-display);font-size:var(--t-section);font-weight:var(--w-section);color:var(--text);margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--border)}
table{width:100%;border-collapse:collapse;background:var(--surface);border-radius:var(--r);overflow:hidden;border:1px solid var(--border)}
th{background:var(--surface-2);padding:10px 14px;font-family:var(--r2-mono);font-size:var(--r2-eyebrow);font-weight:500;text-transform:uppercase;letter-spacing:0.11em;color:var(--muted);text-align:left}
td{padding:10px 14px;font-size:var(--t-meta);border-top:1px solid var(--border);font-family:var(--r2-mono);color:var(--text-2)}
tr:hover td{background:var(--surface-2)}
.ok{color:var(--green-text)}.warn{color:var(--amber-text)}.err{color:var(--red-text)}
.muted{color:var(--muted)}
.run-btn{padding:10px 20px;background:var(--accent);color:var(--accent-contrast);border:none;border-radius:var(--r-sm);font-size:var(--t-second);font-weight:700;font-family:inherit;cursor:pointer;margin-bottom:20px;transition:background-color var(--motion-fast) var(--ease-out)}
.run-btn:hover{background:var(--accent-2)}
.run-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.run-btn:disabled{opacity:.6;cursor:default}
#report{display:none}
.summary-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:20px;margin-bottom:22px;display:flex;gap:28px;align-items:center;flex-wrap:wrap}
.sum-num{font-family:var(--r2-mono);font-size:var(--t-kpi);font-weight:700;font-variant-numeric:tabular-nums;color:var(--text)}
.sum-label{font-family:var(--r2-mono);font-size:var(--r2-eyebrow);color:var(--muted);text-transform:uppercase;letter-spacing:0.11em;margin-top:2px}
.sum-figs{display:flex;gap:24px;flex-wrap:wrap}
.sum-fig{text-align:center}
.sum-grow{flex:1;min-width:220px}
.sum-title{font-size:var(--t-card);font-weight:var(--w-card);margin-bottom:4px;color:var(--text)}
.sum-sub{font-size:var(--t-second);color:var(--muted)}
.pct-circle{width:78px;height:78px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--r2-mono);font-size:var(--t-section);font-weight:700;border:3px solid var(--accent);color:var(--accent-text);flex-shrink:0}
.bar-cap{margin-top:10px;max-width:300px}
</style>
</head>
<body>

<h1>🔍 Translation Audit — M-EasyTools AI+</h1>
<p class="subtitle">Scans all locale JSON files and checks translation key coverage across EN, ZH, and MS</p>

<button class="run-btn" onclick="runAudit()">▶ Run Audit Now</button>

<div id="report"></div>

<script>
async function runAudit() {
  const btn = document.querySelector('.run-btn');
  btn.textContent = '⏳ Running…';
  btn.disabled = true;

  const report = document.getElementById('report');
  report.style.display = 'none';
  report.innerHTML = '';

  try {
    const [en, zh, ms] = await Promise.all([
      fetch('/locales/en.json').then(r => r.json()),
      fetch('/locales/zh.json').then(r => r.json()),
      fetch('/locales/ms.json').then(r => r.json()),
    ]);

    const enKeys = flattenKeys(en);
    const zhKeys = flattenKeys(zh);
    const msKeys = flattenKeys(ms);

    const allKeys = new Set([...Object.keys(enKeys), ...Object.keys(zhKeys), ...Object.keys(msKeys)]);
    const total = allKeys.size;

    const zhMissing = [...allKeys].filter(k => !(k in zhKeys));
    const msMissing = [...allKeys].filter(k => !(k in msKeys));
    const enMissing = [...allKeys].filter(k => !(k in enKeys));

    const zhCoverage = Math.round(((total - zhMissing.length) / total) * 100);
    const msCoverage = Math.round(((total - msMissing.length) / total) * 100);
    const enCoverage = Math.round(((total - enMissing.length) / total) * 100);
    const overallCoverage = Math.round((zhCoverage + msCoverage + enCoverage) / 3);

    const checkHardcoded = await auditHardcoded();

    report.innerHTML = `
      <div class="summary-box">
        <div class="pct-circle">${overallCoverage}%</div>
        <div class="sum-grow">
          <div class="sum-title">Overall Translation Coverage</div>
          <div class="sum-sub">Across ${total} unique translation keys · 3 languages</div>
          <div class="progress-bar bar-cap"><div class="progress-fill" style="width:${overallCoverage}%"></div></div>
        </div>
        <div class="sum-figs">
          <div class="sum-fig"><div class="sum-num">${total}</div><div class="sum-label">Total Keys</div></div>
          <div class="sum-fig"><div class="sum-num ok">${total - zhMissing.length - msMissing.length}</div><div class="sum-label">Translated</div></div>
          <div class="sum-fig"><div class="sum-num err">${zhMissing.length + msMissing.length}</div><div class="sum-label">Missing</div></div>
        </div>
      </div>

      <div class="grid">
        ${langCard('English (EN)', enCoverage, total, enMissing, 'en', enKeys)}
        ${langCard('Simplified Chinese (ZH)', zhCoverage, total, zhMissing, 'zh', zhKeys)}
        ${langCard('Bahasa Malaysia (MS)', msCoverage, total, msMissing, 'ms', msKeys)}
      </div>

      <div class="section">
        <div class="section-title">📄 Locale File Stats</div>
        <table>
          <thead><tr><th>File</th><th>Keys</th><th>Coverage</th><th>Missing</th><th>Status</th></tr></thead>
          <tbody>
            ${fileRow('en.json', Object.keys(enKeys).length, total, enMissing.length)}
            ${fileRow('zh.json', Object.keys(zhKeys).length, total, zhMissing.length)}
            ${fileRow('ms.json', Object.keys(msKeys).length, total, msMissing.length)}
          </tbody>
        </table>
      </div>

      ${zhMissing.length > 0 ? missingTable('Missing ZH Keys', zhMissing, enKeys) : ''}
      ${msMissing.length > 0 ? missingTable('Missing MS Keys', msMissing, enKeys) : ''}

      <div class="section">
        <div class="section-title">🔍 Hardcoded String Scan</div>
        <div class="card">
          <div class="sum-sub" style="line-height:1.8">
            ${checkHardcoded}
          </div>
        </div>
      </div>
    `;
    report.style.display = 'block';

  } catch(e) {
    report.innerHTML = `<div class="card"><div class="stat-label err">Error: ${e.message}</div></div>`;
    report.style.display = 'block';
  }

  btn.textContent = '▶ Run Audit Now';
  btn.disabled = false;
}

function flattenKeys(obj, prefix = '') {
  const result = {};
  for (const [k, v] of Object.entries(obj)) {
    const key = prefix ? `${prefix}.${k}` : k;
    if (v !== null && typeof v === 'object' && !Array.isArray(v)) {
      Object.assign(result, flattenKeys(v, key));
    } else {
      result[key] = v;
    }
  }
  return result;
}

function langCard(title, pct, total, missing, code, keys) {
  const status = pct === 100 ? 'ok' : pct >= 80 ? 'warn' : 'err';
  const badgeClass = `badge-${status}`;
  const badgeText = pct === 100 ? '✓ Complete' : `${missing.length} missing`;
  return `
    <div class="card">
      <div class="card-title">
        ${title}
        <span class="badge ${badgeClass}">${badgeText}</span>
      </div>
      <div class="stat-row"><span class="stat-label">Coverage</span><span class="stat-val ${status === 'ok' ? 'ok' : status === 'warn' ? 'warn' : 'err'}">${pct}%</span></div>
      <div class="stat-row"><span class="stat-label">Translated Keys</span><span class="stat-val">${Object.keys(keys).length} / ${total}</span></div>
      <div class="stat-row"><span class="stat-label">Missing Keys</span><span class="stat-val ${missing.length > 0 ? 'err' : 'ok'}">${missing.length}</span></div>
      <div class="progress-bar"><div class="progress-fill is-${status}" style="width:${pct}%"></div></div>
    </div>`;
}

function fileRow(file, keys, total, missing) {
  const pct = Math.round((keys / total) * 100);
  const cls = missing === 0 ? 'ok' : missing < 10 ? 'warn' : 'err';
  return `<tr><td>${file}</td><td>${keys}</td><td class="${cls}">${pct}%</td><td class="${missing>0?'err':'ok'}">${missing}</td><td><span class="badge badge-${cls === 'ok' ? 'ok' : cls === 'warn' ? 'warn' : 'err'}">${missing===0?'✓ Complete':'Incomplete'}</span></td></tr>`;
}

function missingTable(title, missing, enKeys) {
  if (!missing.length) return '';
  return `
    <div class="section">
      <div class="section-title">⚠️ ${title} (${missing.length})</div>
      <table>
        <thead><tr><th>Key</th><th>English Value</th></tr></thead>
        <tbody>
          ${missing.slice(0, 50).map(k => `<tr><td class="warn">${k}</td><td class="muted">${String(enKeys[k]||'').substring(0,80)}</td></tr>`).join('')}
          ${missing.length > 50 ? `<tr><td colspan="2" class="muted" style="text-align:center">… and ${missing.length-50} more</td></tr>` : ''}
        </tbody>
      </table>
    </div>`;
}

async function auditHardcoded() {
  const pages = ['index.html','app.html','gao.html','auth.html','seller.html'];
  const results = [];
  for (const page of pages) {
    try {
      const res = await fetch(`/${page}`);
      const html = await res.text();
      const dataI18nCount = (html.match(/data-i18n=/g) || []).length;
      const dataI18nHtmlCount = (html.match(/data-i18n-html=/g) || []).length;
      const total = dataI18nCount + dataI18nHtmlCount;
      const status = page === 'seller.html' ? '(seller panel - optional)' : total > 50 ? '✓ Good coverage' : total > 10 ? '⚠ Partial' : '❌ Needs work';
      results.push(`<strong>${page}</strong>: ${total} translated nodes — ${status}`);
    } catch(e) {
      results.push(`<strong>${page}</strong>: Could not scan (${e.message})`);
    }
  }
  return results.join('<br>');
}
</script>
</body>
</html>
