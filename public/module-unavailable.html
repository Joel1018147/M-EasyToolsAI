<!DOCTYPE html>
<html data-platform="tools" lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Module Unavailable — M-EasyTools AI+</title>
<link rel="stylesheet" href="/css/modus-design-system.css">
<link rel="stylesheet" href="/css/r2-tokens.css">
<style>
/* This page pasted the platform orange twice as a literal (#E8622A and
   rgba(232,98,42,…)) — a second source of truth for a colour that is locked
   once, upstream, for twelve platforms. Both are gone. */
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-xl);padding:44px 40px;text-align:center;max-width:440px;width:100%;box-shadow:var(--shadow)}
.icon{font-size:48px;margin-bottom:18px;opacity:.5}
.title{font-family:var(--font-display);font-size:var(--t-section);font-weight:var(--w-section);color:var(--text);margin-bottom:10px}
.sub{font-size:var(--t-body);color:var(--muted);line-height:1.6;margin-bottom:26px}
.badge{display:inline-flex;align-items:center;gap:6px;background:var(--amber-bg);border:1px solid var(--amber);color:var(--amber-text);padding:5px 14px;border-radius:999px;font-size:var(--t-meta);font-weight:700;margin-bottom:24px}
.btn{display:inline-flex;align-items:center;gap:7px;padding:11px 24px;border-radius:var(--r-sm);font-size:var(--t-body);font-weight:600;cursor:pointer;border:none;font-family:inherit;text-decoration:none;background:var(--accent);color:var(--accent-contrast);transition:background-color var(--motion-fast) var(--ease-out)}
.btn:hover{background:var(--accent-2)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<div class="card">
  <div class="icon">🔒</div>
  <div class="badge">⚠️ Module Disabled</div>
  <div class="title">This module is currently unavailable</div>
  <div class="sub">The seller has temporarily disabled this module. Please check back later or contact support.</div>
  <a href="/" class="btn">← Back to Home</a>
</div>
</body>
</html>
